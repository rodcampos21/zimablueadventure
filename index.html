<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1430">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zima Blue Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
</head>
<body>
<div id="stage">
  <canvas id="game" width="640" height="360"></canvas>

  <div id="touch" class="hidden" aria-hidden="true">
    <div id="dpad">
      <button class="tb" data-k="left">◀</button>
      <button class="tb" data-k="down">▼</button>
      <button class="tb" data-k="right">▶</button>
    </div>
    <div id="actions">
      <button class="tb act" data-k="special"><span>Bolhas</span></button>
      <button class="tb act" data-k="roll"><span>Rolar</span></button>
      <button class="tb act" data-k="attack"><span>Rede</span></button>
      <button class="tb act big" data-k="jump"><span>Pular</span></button>
    </div>
  </div>

  <div id="topbar">
    <button id="btnPause" title="Pausar (Esc)">❚❚</button>
    <button id="btnSound" title="Som (M)">♪</button>
    <button id="btnFull" title="Tela cheia">⛶</button>
  </div>

  <div id="rotate">
    <div>↻</div>
    <p>Gire o celular para jogar na horizontal</p>
  </div>
</div>

<script src="js/atlas.js"></script>
<script src="js/core.js"></script>
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/level.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/boss.js"></script>
<script src="js/game.js"></script>
</body>
</html>
