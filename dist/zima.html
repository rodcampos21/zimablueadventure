<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1430">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zima Blue Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; background: #0d0a18; overflow: hidden;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  font-family: 'Press Start 2P', ui-monospace, monospace;
}
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#game {
  image-rendering: pixelated; image-rendering: crisp-edges;
  background: #000; display: block;
  box-shadow: 0 0 0 1px #2a2142, 0 20px 60px rgba(0,0,0,.6);
}

/* ---------- controles de toque ---------- */
#touch.hidden { display: none; }
#touch { position: fixed; inset: 0; pointer-events: none; }
.tb {
  pointer-events: auto; position: relative;
  border: 2px solid rgba(255,255,255,.35); background: rgba(20,14,40,.38);
  color: rgba(255,255,255,.85); font: inherit; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  touch-action: none; backdrop-filter: blur(2px);
}
.tb.on { background: rgba(110,170,255,.45); border-color: #bfe0ff; transform: scale(.94); }
#dpad {
  position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom));
  display: grid; grid-template-columns: 64px 54px 64px; gap: 8px; align-items: end;
}
#dpad .tb { width: 64px; height: 64px; font-size: 20px; border-radius: 18px; }
#dpad .tb[data-k="down"] { width: 54px; height: 54px; border-radius: 16px; font-size: 16px; }
#actions {
  position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom));
  width: 200px; height: 170px;
}
#actions .tb { position: absolute; width: 64px; height: 64px; font-size: 8px; }
#actions .tb span { pointer-events: none; }
#actions [data-k="attack"] { right: 0; bottom: 0; width: 84px; height: 84px; font-size: 9px; background: rgba(60,110,200,.4); }
#actions [data-k="roll"] { right: 96px; bottom: 0; }
#actions [data-k="special"] { right: 22px; bottom: 96px; background: rgba(120,200,255,.3); }

#topbar { position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); display: flex; gap: 6px; }
#topbar button {
  width: 34px; height: 34px; border-radius: 10px; font-size: 13px; color: #fff;
  background: rgba(20,14,40,.5); border: 1px solid rgba(255,255,255,.3); font-family: system-ui, sans-serif;
}
#topbar button.off { opacity: .45; }

#rotate {
  display: none; position: fixed; inset: 0; background: #140f26; color: #fff;
  flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; z-index: 10;
  font-size: 11px; line-height: 1.8; padding: 30px;
}
#rotate div { font-size: 54px; animation: spin 2s ease-in-out infinite; }
@keyframes spin { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }

</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="640" height="360"></canvas>

  <div id="touch" class="hidden" aria-hidden="true">
    <div id="dpad">
      <button class="tb" data-k="left">◀</button>
      <button class="tb" data-k="down">▼</button>
      <button class="tb" data-k="right">▶</button>
    </div>
    <div id="actions">
      <button class="tb act" data-k="special"><span>Bolhas</span></button>
      <button class="tb act" data-k="roll"><span>Rolar</span></button>
      <button class="tb act big" data-k="attack"><span>Rede</span></button>
    </div>
  </div>

  <div id="topbar">
    <button id="btnPause" title="Pausar (Esc)">❚❚</button>
    <button id="btnSound" title="Som (M)">♪</button>
    <button id="btnFull" title="Tela cheia">⛶</button>
  </div>

  <div id="rotate">
    <div>↻</div>
    <p>Gire o celular para jogar na horizontal</p>
  </div>
</div>

<script>
// Núcleo: constantes, utilitários, partículas, textos flutuantes e câmera.
'use strict';
const Z = window.Z = {};

Z.W = 640; Z.H = 360; Z.T = 16;
Z.FONT = "'Press Start 2P', ui-monospace, monospace";

Z.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
Z.lerp = (a, b, t) => a + (b - a) * t;
Z.rand = (a, b) => a + Math.random() * (b - a);
Z.irand = (a, b) => Math.floor(Z.rand(a, b + 1));
Z.sign = v => v < 0 ? -1 : 1;
Z.approach = (v, target, step) => v < target ? Math.min(v + step, target) : Math.max(v - step, target);

// retângulo de uma entidade ancorada no centro dos pés
Z.box = e => ({ l: e.x - e.w / 2, r: e.x + e.w / 2, t: e.y - e.h, b: e.y });
Z.overlap = (a, b) => a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t;

// ---------- partículas ----------
Z.particles = [];
Z.emit = (x, y, n, o = {}) => {
  for (let i = 0; i < n; i++) {
    const ang = o.angle !== undefined ? o.angle + Z.rand(-(o.spread || 3.14), o.spread || 3.14) : Z.rand(0, Math.PI * 2);
    const sp = Z.rand(o.speedMin || 30, o.speed || 120);
    Z.particles.push({

// Entrada unificada: teclado, toque (multitoque) e gamepad.
'use strict';
(() => {
  const ACTIONS = ['left', 'right', 'down', 'up', 'attack', 'roll', 'special', 'pause', 'confirm', 'jump'];
  const KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    ArrowDown: 'down', KeyS: 'down', ArrowUp: 'up', KeyW: 'jump', Space: 'jump',
    KeyJ: 'attack', KeyZ: 'attack', KeyK: 'roll', KeyX: 'roll', ShiftLeft: 'roll', ShiftRight: 'roll',

    // consome uma entrada do buffer (aperto recente, ainda não usado)
    take(a) { if (buffer[a] > 0) { buffer[a] = 0; return true; } return false; },
    clear() { ACTIONS.forEach(a => buffer[a] = 0); },

  addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) src.key[a] = false; });
  addEventListener('blur', () => { src.key = {}; src.touch = {}; });

  // ---------- toque: cada dedo é rastreado e pode deslizar entre botões ----------
  const touchEl = document.getElementById('touch');

    for (const el of fingers.values()) if (el && !src.touch[el.dataset.k]) taps.add(el.dataset.k);

  A.chest = (c, x, by, t) => {

<script>
// Fase tutorial: "Vila Azul do Interior". Mapa de tiles, objetos, colisão e pintura do cenário.
'use strict';
(() => {
  const T = Z.T;
  const COLS = 284, ROWS = 34;
  const E = 0, G = 1, BRK = 2, BRIDGE = 3, GATE = 4, WATER = 5, SOBRADO = 6;

  // Textos das placas (tokens trocados conforme o controle em uso)
  const SIGNS = [
    { tx: 30, row: 14, text: '{MOVE} para andar. A Prefeitura fica lá pra frente!' },
    { tx: 46, row: 17, text: 'Teto baixo! Segure {DOWN} para agachar e passar por baixo da marquise.' },
    { tx: 79, row: 20, text: 'Pombos bravos! Ataque com {ATK}. Cada acerto enche seu CARISMA.' },
    { tx: 113, row: 22, text: 'Os cabos do Coronel jogam santinhos na altura da cabeça. Agache ({DOWN}) ou role ({ROLL}).' },
    { tx: 119, row: 22, text: 'Role no ÚLTIMO instante: se o golpe passar durante o giro, é ESQUIVA PERFEITA (ganha Carisma)!' },
    { tx: 176, row: 28, text: 'A ponte está erguida! Acerte a alavanca do outro lado com BOLHAS ({SPC}). Gasta 1 Carisma. Sem Carisma? Encoste na Urna.' },
    { tx: 207, row: 28, text: 'Um baú lá no alto da sacada... Volte quando souber PULAR.' },
    { tx: 235, row: 28, text: 'Prefeitura Municipal. O Coronel Bigodão te espera. Lembre: rolar atravessa a investida!' },
  ];

  Z.makeLevel = save => {
    const grid = new Uint8Array(COLS * ROWS);
    const set = (x, y, v) => { if (x >= 0 && y >= 0 && x < COLS && y < ROWS) grid[y * COLS + x] = v; };
    const fill = (x0, x1, y0, y1, v) => { for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) set(x, y, v); };
    const ground = (x0, x1, top) => fill(x0, x1, top, ROWS, G);

    ground(0, 40, 14);        // Rodoviária
    ground(40, 75, 17);       // Rua do Comércio
    ground(75, 110, 20);      // Praça dos Pombos
    ground(110, 160, 22);     // Rua dos Cabos + banco
    ground(160, 185, 28);     // Córrego
    fill(185, 195, 31, ROWS, G); fill(185, 195, 29, 31, WATER);
    ground(195, COLS, 28);    // Igreja + Prefeitura
    fill(0, 1, 0, ROWS, G); fill(COLS - 1, COLS, 0, ROWS, G); // bordas
    fill(52, 61, 0, 15, SOBRADO);                              // marquise baixa
    fill(150, 159, 23, 28, E);                                 // porão secreto
    fill(159, 160, 23, 28, BRK);                               // muro rachado
    fill(210, 217, 21, 22, G);                                 // sacada da igreja (inalcançável)

    const L = {
      cols: COLS, rows: ROWS, pw: COLS * T, ph: ROWS * T, grid,
      wall: { tx: 159, ty0: 23, ty1: 27, hp: save.wall ? 0 : 3, shake: 0 },
      bridge: { tx0: 185, tx1: 194, ty: 28, lowered: !!save.bridge, anim: save.bridge ? 1 : 0 },
      gate: { tx: 243, ty0: 22, ty1: 27, closed: false, anim: 0 },
      arena: { x0: 243 * T, x1: (COLS - 1) * T, trigger: 250 * T },
      signs: SIGNS.map(s => ({ x: s.tx * T + 8, y: s.row * T, text: s.text })),
      benches: [{ id: 'b1', x: 148 * T + 8, y: 22 * T }, { id: 'b2', x: 231 * T + 8, y: 28 * T }],
      spawns: { start: { x: 15 * T, y: 14 * T }, b1: { x: 148 * T + 8, y: 22 * T }, b2: { x: 231 * T + 8, y: 28 * T } },
      npc: { x: 22 * T, y: 14 * T },
      urna: { x: 170 * T + 8, y: 28 * T, cd: 0 },
      coxinha: save.coxinha ? null : { x: 154 * T + 8, y: 28 * T },
      lever: { x: 197 * T + 8, y: 28 * T, on: !!save.bridge },
      chest: { x: 213 * T + 8, y: 21 * T },
      enemies: [
        { type: 'pombo', x: 86 * T, y: 15 * T }, { type: 'pombo', x: 97 * T, y: 14 * T }, { type: 'pombo', x: 105 * T, y: 15 * T },
        { type: 'cabo', x: 127 * T, y: 22 * T }, { type: 'cabo', x: 139 * T, y: 22 * T },
        { type: 'cabo', x: 205 * T, y: 28 * T }, { type: 'pombo', x: 222 * T, y: 23 * T },
      ],
      bossSpawn: { x: 272 * T, y: 28 * T },
    };

    L.tile = (tx, ty) => (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) ? G : grid[ty * COLS + tx];
    L.solidT = (tx, ty) => {
      const v = L.tile(tx, ty);
      if (v === G || v === SOBRADO) return true;
      if (v === BRK) return L.wall.hp > 0;
      if (v === BRIDGE) return false;
      if (tx >= L.bridge.tx0 && tx <= L.bridge.tx1 && ty === L.bridge.ty) return L.bridge.lowered;
      if (tx === L.gate.tx && ty >= L.gate.ty0 && ty <= L.gate.ty1) return L.gate.closed;
      return false;
    };
    L.solidAt = (x, y) => L.solidT(Math.floor(x / T), Math.floor(y / T));
    L.rectSolid = (l, t, r, b) => {
      for (let ty = Math.floor(t / T); ty <= Math.floor((b - 0.01) / T); ty++)
        for (let tx = Math.floor(l / T); tx <= Math.floor((r - 0.01) / T); tx++) if (L.solidT(tx, ty)) return true;
      return false;
    };
    L.waterAt = (x, y) => L.tile(Math.floor(x / T), Math.floor(y / T)) === WATER;

    // move um corpo (x = centro, y = pés) resolvendo colisões por eixo
    L.move = (e, dx, dy) => {
      const res = { hitX: false, hitY: false, ground: false, ceil: false };
      const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 6));
      const sx = dx / steps, sy = dy / steps;
      for (let s = 0; s < steps; s++) {
        if (sx) {
          e.x += sx;
          const t = e.y - e.h + 0.5, b = e.y - 0.5;
          if (sx > 0) { const r = e.x + e.w / 2; if (L.rectSolid(r - 0.01, t, r, b)) { e.x = Math.floor(r / T) * T - e.w / 2 - 0.01; res.hitX = true; } }
          else { const l = e.x - e.w / 2; if (L.rectSolid(l, t, l + 0.01, b)) { e.x = (Math.floor(l / T) + 1) * T + e.w / 2 + 0.01; res.hitX = true; } }
        }
        if (sy) {
          e.y += sy;
          const l = e.x - e.w / 2 + 0.5, r = e.x + e.w / 2 - 0.5;
          if (sy > 0) { if (L.rectSolid(l, e.y - 0.01, r, e.y)) { e.y = Math.floor(e.y / T) * T; res.hitY = res.ground = true; } }
          else { const t = e.y - e.h; if (L.rectSolid(l, t, r, t + 0.01)) { e.y = (Math.floor(t / T) + 1) * T + e.h; res.hitY = res.ceil = true; } }
        }
      }
      return res;
    };
    L.onGround = e => L.rectSolid(e.x - e.w / 2 + 0.5, e.y, e.x + e.w / 2 - 0.5, e.y + 1);

    // golpe em tiles quebráveis; retorna true se acertou
    L.hitRect = (rect, dmg) => {
      const w = L.wall;
      if (w.hp <= 0) return false;
      const wr = { l: w.tx * T, r: (w.tx + 1) * T, t: w.ty0 * T, b: (w.ty1 + 1) * T };
      if (!Z.overlap(rect, wr)) return false;
      w.hp -= dmg; w.shake = 0.2;
      Z.emit(w.tx * T + 4, rect.t + 10, 8, { color: ['#8a8178', '#6b5a4a', '#bdb3a6'], speed: 140, size: 3 });
      if (w.hp <= 0) {
        w.hp = 0; Z.audio.play('break'); Z.cam.shake(4, 0.3);
        for (let ty = w.ty0; ty <= w.ty1; ty++) Z.emit(w.tx * T + 8, ty * T + 8, 10, { color: ['#8a8178', '#6b5a4a', '#bdb3a6'], speed: 180, size: 4, life: 1 });
        Z.floatText(w.tx * T + 8, w.ty0 * T, 'Uma passagem secreta!', '#ffe68a', { life: 2 });
        Z.game.saveFlag('wall', true);
      } else Z.audio.play('hit');
      return true;
    };

    L.closeGate = () => { L.gate.closed = true; L.gate.anim = 0; Z.audio.play('gate'); Z.cam.shake(3, 0.3); };
    L.openGate = () => { L.gate.closed = false; };
    L.lowerBridge = () => {
      if (L.bridge.lowered) return;
      L.bridge.lowered = true; L.lever.on = true; Z.audio.play('lever'); setTimeout(() => Z.audio.play('bridge'), 150);
      Z.floatText(L.lever.x, L.lever.y - 64, 'A ponte desceu!', '#9fe0ff', { life: 2 });
      Z.game.saveFlag('bridge', true);
    };

    L.prerender = () => { L.decor = paintDecor(L); L.tiles = paintTiles(L); };
    L.update = dt => {
      if (L.bridge.lowered) L.bridge.anim = Math.min(1, L.bridge.anim + dt * 1.6);
      if (L.gate.closed) L.gate.anim = Math.min(1, L.gate.anim + dt * 4);
      L.wall.shake = Math.max(0, L.wall.shake - dt);
      L.urna.cd = Math.max(0, L.urna.cd - dt);
    };
    L.drawBack = (ctx, cam) => ctx.drawImage(L.decor, cam.x, cam.y, Z.W, Z.H, 0, 0, Z.W, Z.H);
    L.drawTiles = (ctx, cam, t) => {
      ctx.drawImage(L.tiles, cam.x, cam.y, Z.W, Z.H, 0, 0, Z.W, Z.H);
      drawDynamic(ctx, L, cam, t);
    };
    return L;
  };

  // ---------------- pintura dos tiles ----------------
  function paintTiles(L) {
    const c = Z.art.canvas(L.pw, L.ph).getContext('2d'), R = Z.art.R;
    const solid = (x, y) => { const v = L.tile(x, y); return v === G; };
    const rnd = Z.art.rng(42);
    for (let ty = 0; ty < L.rows; ty++) for (let tx = 0; tx < L.cols; tx++) {
      if (L.tile(tx, ty) !== G) continue;
      const x = tx * T, y = ty * T;
      const grass = tx >= 160 && tx < 200;
      R(c, x, y, T, T, '#6b4a35');
      for (let i = 0; i < 4; i++) R(c, x + rnd() * 14, y + rnd() * 14, 2 + rnd() * 2, 2, rnd() > 0.5 ? '#5a3d2b' : '#7a5741');
      if (rnd() > 0.85) R(c, x + rnd() * 10, y + rnd() * 10, 4, 3, '#8e8274');
      const top = !solid(tx, ty - 1) && L.tile(tx, ty - 1) !== SOBRADO;
      if (top) {
        if (grass) {
          R(c, x, y, T, 5, '#5e9a48'); R(c, x, y + 5, T, 2, '#4a7d3a');
          for (let i = 0; i < 4; i++) R(c, x + rnd() * 15, y - 2, 1, 3, '#6fb056');
        } else { // paralelepípedo
          R(c, x, y, T, 7, '#5e574f');
          for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
            const ox = j === 1 ? 4 : 0;
            R(c, x + ox + i * 8 + 1, y + j * 3 + 1, 6, 2, rnd() > 0.5 ? '#a39a8f' : '#958c81');
          }
          R(c, x, y, T, 1, '#c4bcb0'); R(c, x, y + 7, T, 1, '#4a3a2c');
        }
      }
      if (!solid(tx - 1, ty) && L.tile(tx - 1, ty) !== BRK) { R(c, x, y, 2, T, '#4a3324'); if (top) R(c, x, y, 2, 7, '#4a443d'); }
      if (!solid(tx + 1, ty) && L.tile(tx + 1, ty) !== BRK) { R(c, x + T - 2, y, 2, T, '#4a3324'); if (top) R(c, x + T - 2, y, 2, 7, '#4a443d'); }
      if (!solid(tx, ty + 1) && ty + 1 < L.rows) R(c, x, y + T - 2, T, 2, '#3b281c');
    }
    // sobrado da marquise (tiles 52..60, linhas 0..14)
    const sx = 52 * T, sw = 9 * T, sb = 15 * T;
    R(c, sx, 0, sw, sb, '#d9734e');
    for (let wy = 30; wy < sb - 60; wy += 46) for (let i = 0; i < 3; i++) {
      const wx = sx + 18 + i * 44;
      R(c, wx - 2, wy - 2, 20, 30, '#fbe9d0'); R(c, wx, wy, 16, 26, '#3a2b3e'); R(c, wx + 1, wy + 1, 14, 10, '#f6d38c');
      R(c, wx - 3, wy + 26, 22, 3, '#fbe9d0'); R(c, wx - 5, wy + 29, 26, 4, '#4b4b5a'); // sacadinha
    }
    R(c, sx, sb - 34, sw, 4, '#fbe9d0');
    // toldo listrado
    for (let i = 0; i < sw; i += 12) { R(c, sx + i, sb - 30, 6, 24, '#e63946'); R(c, sx + i + 6, sb - 30, 6, 24, '#f6f1e6'); }
    for (let i = 0; i < sw; i += 12) { c.fillStyle = i % 24 ? '#f6f1e6' : '#e63946'; c.beginPath(); c.arc(sx + i + 6, sb - 6, 6, 0, Math.PI); c.fill(); }
    R(c, sx, sb - 30, sw, 2, '#9c1f2a');
    c.font = `8px ${Z.FONT}`; c.textAlign = 'center'; c.textBaseline = 'top';
    R(c, sx + sw / 2 - 40, sb - 54, 80, 14, '#3b2414'); c.fillStyle = '#ffe08a'; c.fillText('PADARIA', sx + sw / 2, sb - 51);
    return c.canvas;
  }

  // ---------------- pintura do cenário (fundo da fase) ----------------
  function paintDecor(L) {
    const c = Z.art.canvas(L.pw, L.ph).getContext('2d'), A = Z.art, R = A.R;
    const gy = row => row * T;

    // --- Rodoviária ---
    A.house(c, 190, gy(14), 220, 96, { wall: '#e8d9b0', sign: 'RODOVIÁRIA', windows: 4, shutter: '#2e5d8a', roofColor: '#8a3a2a' });
    R(c, 200, gy(14) - 40, 200, 6, '#2e5d8a');
    A.lamp(c, 430, gy(14)); A.ipe(c, 480, gy(14), 1.1);
    A.house(c, 520, gy(14), 110, 70, { wall: '#c05b7a', windows: 2, shutter: '#f2e6c9', trim: '#fff1f6' });
    // ônibus
    const bx = 20, by = gy(14);
    R(c, bx, by - 58, 150, 48, '#e9e2cc'); R(c, bx, by - 34, 150, 10, '#2e5d8a'); R(c, bx, by - 58, 150, 4, '#cfc6ae');
    for (let i = 0; i < 6; i++) R(c, bx + 8 + i * 23, by - 52, 18, 14, '#7fb3d9');
    R(c, bx + 136, by - 52, 12, 30, '#7fb3d9');
    R(c, bx, by - 14, 150, 4, '#3a3a44');
    for (const wx of [bx + 26, bx + 120]) { c.fillStyle = '#222'; c.beginPath(); c.arc(wx, by - 8, 9, 0, 7); c.fill(); R(c, wx - 3, by - 11, 6, 6, '#999'); }
    c.font = `8px ${Z.FONT}`; c.fillStyle = '#fff'; c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText('VIAÇÃO AZUL', bx + 10, by - 32);

    // --- Rua do Comércio ---
    A.house(c, 650, gy(17), 160, 90, { wall: '#7fb87a', sign: 'FARMÁCIA', signBg: '#1f6a3a', shutter: '#f5f0e0', trim: '#f7ffef' });
    // interior escuro sob a marquise
    R(c, 52 * T, gy(15), 9 * T, 2 * T, '#3a2626');
    R(c, 52 * T + 20, gy(15) + 6, 50, 14, '#8a5a3a'); R(c, 52 * T + 22, gy(15) + 4, 46, 3, '#c9a27a');

    R(c, 52 * T + 96, gy(15) + 2, 30, 28, '#5a3a3a');
    A.house(c, 985, gy(17), 200, 96, { wall: '#e8c547', sign: 'MERCEARIA', signBg: '#8a3a2a', shutter: '#2f6f9a', windows: 4 });
    A.bunting(c, 640, 1200, gy(17) - 130, 16);

    // --- Praça dos Pombos ---
    const pg = gy(20);
    A.ipe(c, 1250, pg, 1.3); A.ipe(c, 1720, pg, 1.2, '#f07ab0');
    coreto(c, 1480, pg);
    A.bush(c, 1300, pg, 60); A.bush(c, 1610, pg, 70);
    benchDecor(c, 1370, pg); benchDecor(c, 1600, pg);
    A.lamp(c, 1330, pg); A.lamp(c, 1650, pg);
    A.bunting(c, 1380, 1580, pg - 120, 12);

    // --- Rua dos Cabos ---
    const cg = gy(22);
    A.house(c, 1775, cg, 140, 84, { wall: '#5fa8a0', sign: 'BAR DO ZÉ', signBg: '#6b3f28', shutter: '#f2e6c9', posters: [8, 112] });
    A.house(c, 1930, cg, 150, 96, { wall: '#e9e1cf', shutter: '#8a3a2a', posters: [10, 40, 120], windows: 3 });

    // --- Córrego ---
    const rg = gy(28);
    A.fence(c, 2580, 2700, rg); A.bush(c, 2760, rg, 60); A.ipe(c, 2650, rg, 1.4);
    A.ipe(c, 2900, rg, 1.1, '#f07ab0'); A.fence(c, 3140, 3200, rg);
    // margem de pedras do córrego
    for (let i = 0; i < 10; i++) { c.fillStyle = '#6a6f78'; c.beginPath(); c.arc(185 * T + i * 16 + 8, gy(29) + 2, 5, 0, 7); c.fill(); }
    // muro de pedra do penhasco (fundo)
    for (let y = gy(22); y < rg; y += 10) for (let x = 2560; x < 2620; x += 14) R(c, x + ((y / 10) % 2) * 7, y, 12, 8, 'rgba(90,80,70,.35)');

    // --- Igreja Matriz ---
    igreja(c, 3200, rg);
    A.lamp(c, 3640, rg); A.ipe(c, 3690, rg, 1.2);

    // --- Prefeitura ---
    prefeitura(c, 3880, rg);
    A.bunting(c, 3870, 4500, rg - 190, 20);
    return c.canvas;
  }

  function benchDecor(c, x, by) { Z.art.bench(c, x, by, false, 0); }
  function coreto(c, x, by) {
    const R = Z.art.R;
    R(c, x - 80, by - 14, 160, 14, '#e9e1cf'); R(c, x - 80, by - 16, 160, 3, '#c9bfa6');
    for (let i = -3; i <= 3; i++) { R(c, x + i * 24 - 2, by - 80, 5, 66, '#f6f1e6'); }

    R(c, x - 92, by - 82, 184, 4, '#245a4f'); R(c, x - 1, by - 136, 3, 16, '#e6c35a');
  }
  function igreja(c, x, by) {
    const A = Z.art, R = A.R;
    A.house(c, x, by, 380, 112, { wall: '#f4efe2', roof: false, door: false, windows: 0 });
    // torre
    R(c, x + 150, by - 230, 80, 230, '#f4efe2'); R(c, x + 150, by - 230, 80, 4, '#fff');
    c.fillStyle = '#5a7fb0'; c.beginPath(); c.moveTo(x + 144, by - 230); c.lineTo(x + 190, by - 280); c.lineTo(x + 236, by - 230); c.fill();
    R(c, x + 189, by - 300, 3, 22, '#e6c35a'); R(c, x + 182, by - 292, 17, 3, '#e6c35a');
    c.fillStyle = '#3a2b3e'; c.beginPath(); c.arc(x + 190, by - 190, 14, Math.PI, 0); c.fill(); R(c, x + 176, by - 190, 28, 20, '#3a2b3e');
    c.fillStyle = '#d8b04a'; c.beginPath(); c.arc(x + 190, by - 180, 7, 0, 7); c.fill(); // sino

  function drawDynamic(ctx, L, cam, t) {

    ctx.fillStyle = 'rgba(70,140,190,.85)'; ctx.fillRect(wx, wy + 4, 10 * T, 2 * T - 4);
    for (let i = 0; i < 10 * T; i += 4) R(ctx, wx + i, wy + 3 + Math.round(Math.sin(t * 3 + i * 0.2) * 1.5), 3, 2, '#bfe6ff');

    const b = L.bridge;

      ctx.save(); ctx.translate((b.tx1 + 1) * T - cam.x, b.ty * T - cam.y); ctx.rotate(ang);

      ctx.restore();
    } else {
      // ponte erguida (em pé na margem direita)
      const x0 = (b.tx1 + 1) * T - cam.x - 8, y0 = b.ty * T - cam.y;
      for (let i = 0; i < 10 * T; i += 8) { R(ctx, x0, y0 - i - 8, 7, 7, '#8a5a2a'); R(ctx, x0, y0 - i - 8, 2, 7, '#a8703a'); }
      ctx.strokeStyle = '#444'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x0 + 3, y0 - 160); ctx.lineTo(x0 + 30, y0 - 40); ctx.stroke();
    }
    // muro rachado
    const w = L.wall;
    if (w.hp > 0) {
      const sh = w.shake > 0 ? Math.round(Z.rand(-1, 1)) : 0;
      for (let ty = w.ty0; ty <= w.ty1; ty++) {
        const x = w.tx * T - cam.x + sh, y = ty * T - cam.y;
        R(ctx, x, y, T, T, '#6b4a35'); R(ctx, x, y, 2, T, '#4a3324');
        R(ctx, x + 3, y + 3, 4, 3, '#5a3d2b'); R(ctx, x + 9, y + 10, 4, 2, '#7a5741');

        if (ty % 2 === 0) { R(ctx, x + 6, y + 2, 1, 6, '#2a1a10'); R(ctx, x + 7, y + 8, 1, 5, '#2a1a10'); }
        else { R(ctx, x + 10, y + 4, 1, 5, '#2a1a10'); R(ctx, x + 9, y + 9, 1, 4, '#2a1a10'); }
        if (w.hp < 3) R(ctx, x + 3, y + 6 + (ty % 3), 8, 1, '#2a1a10');
        if (w.hp < 2) R(ctx, x + 2, y + 11, 10, 1, '#2a1a10');

    // portão da arena
    const g = L.gate;
    if (g.closed) {

      for (let i = 0; i < T; i += 5) R(ctx, x + i, y + h - 4, 3, 4, '#8a8a9a');
    }
  }
  const easeOut = k => 1 - Math.pow(1 - k, 3);
})();

<script>
// Zima: movimento, agachar, rolar com janela de invencibilidade, ataque com a rede e jato de bolhas.
'use strict';
(() => {
  const STAND_H = 54, CROUCH_H = 28;
  const RUN = 128, CROUCH_SPEED = 62, ACC = 1300, DEC = 1700;
  const GRAV = 1500, MAX_FALL = 620;
  const ROLL_DUR = 0.46, ROLL_SPEED = 235, ROLL_CD = 0.18;
  const IFRAME_START = 0.05, IFRAME_END = 0.22;        // janela de invencibilidade do rolamento
  const ATK_DUR = 0.34, ATK_ON = 0.07, ATK_OFF = 0.19;
  const SPC_DUR = 0.62, SPC_FIRE = 0.3;

  let atlas, img, whiteImg, ghostImg;
  Z.loadAtlas = () => new Promise((res, rej) => {
    atlas = window.ZIMA_ATLAS;
    img = new Image();
    img.onload = () => {
      whiteImg = tinted('#ffffff'); ghostImg = tinted('#7fd0ff');
      res();
    };
    img.onerror = rej;
    img.src = atlas.image;
  });
  function tinted(col) {
    const c = Z.art.canvas(img.width, img.height), x = c.getContext('2d');
    x.drawImage(img, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height);
    return c;
  }
  Z.drawFrame = (ctx, name, x, y, facing, o = {}) => {
    const f = atlas.frames[name]; if (!f) return;
    const [sx, sy, w, h, ax, ay] = f;
    const src = o.white ? whiteImg : o.ghost ? ghostImg : img;
    const s = o.scale || 1;
    ctx.save();
    if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
    ctx.translate(Math.round(x), Math.round(y));
    ctx.scale(facing * s, s);
    ctx.drawImage(src, sx, sy, w, h, -ax, -ay, w, h);
    ctx.restore();
  };
  Z.animFrame = (anim, t) => {
    const a = atlas.anims[anim];
    let i = Math.floor(t * a.fps);
    i = a.loop ? i % a.frames.length : Math.min(i, a.frames.length - 1);
    return a.frames[i];
  };
  Z.animProgress = (anim, p) => { const a = atlas.anims[anim]; return a.frames[Math.min(a.frames.length - 1, Math.floor(p * a.frames.length))]; };

  class Player {
    constructor(x, y, save) {
      this.x = x; this.y = y; this.w = 16; this.h = STAND_H;
      this.vx = 0; this.vy = 0; this.facing = 1;
      this.maxHp = 5 + (save.coxinha ? 1 : 0); this.hp = this.maxHp;
      this.carisma = 1;
      this.state = 'idle'; this.anim = 'idle'; this.animT = 0;
      this.rollT = 0; this.rollCd = 0; this.atkT = 0; this.spcT = 0; this.fired = 0;
      this.invuln = 0; this.hurtT = 0; this.perfectUsed = false; this.crouchT = 0;
      this.ghosts = []; this.atkHits = new Set(); this.grounded = true; this.stepT = 0;
      this.lastSafe = { x, y }; this.jumpHintCd = 0;
    }
    get rolling() { return this.state === 'roll'; }
    get iframes() { return this.rolling && this.rollT >= IFRAME_START && this.rollT <= IFRAME_END; }
    headroom(h = STAND_H) { return !Z.game.level.rectSolid(this.x - this.w / 2 + 0.5, this.y - h, this.x + this.w / 2 - 0.5, this.y - 1); }

    setState(s) { if (this.state !== s) { this.state = s; } }
    setAnim(a) { if (this.anim !== a) { this.anim = a; this.animT = 0; } }

    update(dt, I) {
      const L = Z.game.level;
      this.animT += dt;
      this.invuln = Math.max(0, this.invuln - dt);
      this.grace = Math.max(0, (this.grace || 0) - dt);
      this.rollCd = Math.max(0, this.rollCd - dt);
      this.jumpHintCd = Math.max(0, this.jumpHintCd - dt);
      if (this.state === 'dead' || this.state === 'kneel') { this.vx = 0; this.physics(dt, L); return; }

      const dir = (I.down('right') ? 1 : 0) - (I.down('left') ? 1 : 0);
      const wantCrouch = I.down('down');

      if (I.take('jump') && this.jumpHintCd <= 0) {
        this.jumpHintCd = 2.5; Z.floatText(this.x, this.y - 70, 'Pular? Ainda não sei...', '#ffe68a', { life: 1.6, size: 8 });
      }

      switch (this.state) {
        case 'hurt':
          this.hurtT -= dt; this.vx = Z.approach(this.vx, 0, 600 * dt);
          if (this.hurtT <= 0) this.setState(this.headroom() ? 'idle' : 'crouch');
          break;

        case 'roll': {
          this.rollT += dt;
          const k = this.rollT / ROLL_DUR;
          this.vx = this.facing * ROLL_SPEED * (k < 0.75 ? 1 : 1 - (k - 0.75) * 3);
          if (Math.random() < 0.5) this.ghosts.push({ x: this.x, y: this.y, f: Z.animProgress('roll', k), facing: this.facing, t: 0 });
          if (this.grounded && Math.random() < 0.4) Z.emit(this.x - this.facing * 8, this.y - 2, 1, { color: '#c9b9a0', speed: 40, gravity: -20, life: 0.4, size: 3 });
          if (this.rollT >= ROLL_DUR) {
            this.rollCd = ROLL_CD;
            if (this.headroom()) { this.setState('idle'); this.h = STAND_H; } else { this.setState('crouch'); this.crouchT = 1; }
          }
          break;
        }

        case 'attack': {
          this.atkT += dt;
          this.vx = Z.approach(this.vx, dir * RUN * 0.25, DEC * dt);
          if (this.atkT >= ATK_ON && this.atkT <= ATK_OFF) this.attackHit();
          if (this.atkT > ATK_OFF && I.take('roll') && this.rollCd <= 0) { this.startRoll(dir); break; }
          if (this.atkT >= ATK_DUR) this.setState('idle');
          break;
        }

        case 'special': {
          this.spcT += dt;
          this.vx = Z.approach(this.vx, 0, DEC * dt);
          if (this.spcT >= SPC_FIRE && this.fired < 7) {
            const due = Math.min(7, Math.floor((this.spcT - SPC_FIRE) / 0.035) + 1);
            while (this.fired < due) { this.fireBubble(); this.fired++; }
          }
          if (this.spcT >= SPC_DUR) this.setState('idle');
          break;
        }

        default: { // idle / run / crouch
          // agachar
          const crouching = this.grounded && (wantCrouch || !this.headroom());
          if (crouching && this.state !== 'crouch') { this.setState('crouch'); this.crouchT = 0; }
          if (!crouching && this.state === 'crouch') { this.setState('idle'); this.riseT = 0.1; }
          if (this.state === 'crouch') this.crouchT += dt;

          const max = this.state === 'crouch' ? CROUCH_SPEED : RUN;
          if (dir) { this.vx = Z.approach(this.vx, dir * max, ACC * dt); this.facing = dir; }
          else this.vx = Z.approach(this.vx, 0, DEC * dt);
          if (this.state !== 'crouch') this.setState(Math.abs(this.vx) > 10 ? 'run' : 'idle');

          // ações
          if (I.take('roll') && this.rollCd <= 0 && this.grounded) this.startRoll(dir);
          else if (I.take('attack')) {
            if (this.headroom()) this.startAttack();
            else Z.floatText(this.x, this.y - 40, 'Sem espaço!', '#ccc', { life: 0.6 });
          }
          else if (I.take('special')) {
            if (this.carisma >= 1 && this.headroom()) this.startSpecial();
            else if (this.carisma < 1) { Z.floatText(this.x, this.y - 70, 'Sem Carisma!', '#9fd8ff', { life: 0.9 }); Z.game.hud.flashCarisma = 0.6; }
          }
        }
      }

      this.h = (this.state === 'crouch' || this.state === 'roll') ? CROUCH_H : STAND_H;
      this.physics(dt, L);

      // passos
      if (this.state === 'run' && this.grounded) { this.stepT -= dt; if (this.stepT <= 0) { this.stepT = 0.28; Z.audio.play('step'); } }

      // fantasmas do rolamento
      for (const g of this.ghosts) g.t += dt;
      this.ghosts = this.ghosts.filter(g => g.t < 0.22);

      // queda na água → volta ao último chão seguro
      if (L.waterAt(this.x, this.y + 4)) {
        Z.emit(this.x, this.y, 18, { color: ['#bfe6ff', '#7fc3ea', '#fff'], angle: -Math.PI / 2, spread: 1, speed: 220, size: 3 });
        this.x = this.lastSafe.x; this.y = this.lastSafe.y; this.vx = this.vy = 0;
        this.takeDamage(1, this.x + this.facing, true);
      }
      if (this.grounded && this.state !== 'roll' && L.rectSolid(this.x - 9, this.y, this.x - 7, this.y + 2) && L.rectSolid(this.x + 7, this.y, this.x + 9, this.y + 2))
        this.lastSafe = { x: this.x, y: this.y };

      this.updateAnim();
    }

    physics(dt, L) {
      const wasGrounded = this.grounded;
      this.vy = Math.min(MAX_FALL, this.vy + GRAV * dt);
      const r = L.move(this, this.vx * dt, this.vy * dt);
      if (r.hitY) this.vy = 0;
      if (r.hitX && this.state !== 'roll') this.vx = 0;
      this.grounded = L.onGround(this);
      if (this.grounded && !wasGrounded) { Z.audio.play('land'); Z.emit(this.x, this.y - 1, 6, { color: '#c9b9a0', speed: 60, gravity: 0, life: 0.3, size: 2 }); }
    }

    startRoll(dir) {
      if (dir) this.facing = dir;
      this.setState('roll'); this.rollT = 0; this.perfectUsed = false; this.h = CROUCH_H;
      Z.audio.play('roll'); Z.game.stats.rolls++;
    }
    startAttack() { this.setState('attack'); this.atkT = 0; this.atkHits.clear(); this.h = STAND_H; Z.audio.play('swing'); }
    startSpecial() {
      this.setState('special'); this.spcT = 0; this.fired = 0; this.carisma -= 1; this.h = STAND_H;
      Z.audio.play('bubble');
      Z.emit(this.x + this.facing * 30, this.y - 34, 10, { color: ['#bfe6ff', '#ffffff'], speed: 60, gravity: -40, kind: 'bub', size: 3, life: 0.6 });
    }
    attackRect() {
      const f = this.facing;
      return f > 0 ? { l: this.x + 4, r: this.x + 62, t: this.y - 46, b: this.y - 14 } : { l: this.x - 62, r: this.x - 4, t: this.y - 46, b: this.y - 14 };
    }
    attackHit() {
      const rect = this.attackRect(), G = Z.game;
      for (const e of G.enemies) {
        if (e.dead || this.atkHits.has(e) || !e.hurtbox) continue;
        if (Z.overlap(rect, e.hurtbox())) {
          this.atkHits.add(e);
          e.hurt(1, this.facing, 'melee');
          this.gainCarisma(0.25);
          G.hitstop(0.06); Z.cam.shake(2, 0.1);
          const hb = e.hurtbox();
          Z.emit((Math.max(rect.l, hb.l) + Math.min(rect.r, hb.r)) / 2, (hb.t + hb.b) / 2, 8, { color: ['#ffffff', '#9fd8ff', '#ffe68a'], speed: 160, gravity: 0, life: 0.25, size: 3 });
          this.vx -= this.facing * 40; // pequeno recuo
        }
      }
      if (!this.atkHits.has('wall') && G.level.hitRect(rect, 1)) { this.atkHits.add('wall'); G.hitstop(0.05); }
    }
    fireBubble() {
      const f = this.facing;
      Z.game.projectiles.push(new Z.Bubble(this.x + f * 38, this.y - 32 + Z.rand(-5, 5), f * Z.rand(240, 290), Z.rand(-30, 12)));
      if (this.fired % 2 === 0) Z.audio.play('pop');
    }
    gainCarisma(v) {
      const before = Math.floor(this.carisma);
      this.carisma = Math.min(3, this.carisma + v);
      if (Math.floor(this.carisma) > before) { Z.game.hud.flashCarisma = 0.5; Z.audio.play('pickup'); }
    }

    // chamado por inimigos/projéteis. Retorna 'hit' | 'perfect' | 'dodged' | 'immune'
    hurt(dmg, fromX) {
      if (this.state === 'dead') return 'immune';
      if (this.grace > 0) return 'dodged';
      if (this.iframes) {
        if (!this.perfectUsed) {
          this.perfectUsed = true; this.grace = 0.3; // esquiva perfeita protege até o golpe passar
          Z.game.perfectDodge(this);
          return 'perfect';
        }
        return 'dodged';
      }
      if (this.invuln > 0) return 'immune';
      this.takeDamage(dmg, fromX);
      return 'hit';
    }
    takeDamage(dmg, fromX, noKnock) {
      this.hp -= dmg; this.invuln = 1.1;
      Z.audio.play('hurt'); Z.cam.shake(4, 0.25); Z.game.hitstop(0.09);
      Z.emit(this.x, this.y - 30, 12, { color: ['#ff5a6a', '#ffffff'], speed: 150, size: 3 });
      if (this.hp <= 0) { this.hp = 0; this.setState('dead'); this.vx = 0; Z.game.onPlayerDeath(); return; }
      if (!noKnock) { this.setState('hurt'); this.hurtT = 0.3; this.vx = (this.x < fromX ? -1 : 1) * 170; }
      else { this.setState('idle'); }
    }

    updateAnim() {
      switch (this.state) {
        case 'roll': this.anim = 'roll'; break;
        case 'attack': this.anim = 'attack'; break;
        case 'special': this.anim = 'special'; break;
        case 'crouch':
          if (this.crouchT < 0.12) this.setAnim('crouchDown');
          else this.setAnim(Math.abs(this.vx) > 5 ? 'crouchWalk' : 'crouch');
          break;
        case 'hurt': this.setAnim('fall'); break;
        case 'dead': this.setAnim('kneel'); break;
        case 'kneel': this.setAnim('kneel'); break;
        default:
          if (!this.grounded) this.setAnim('fall');
          else if (this.state === 'run') this.setAnim('run');
          else this.setAnim('idle');
      }
    }
    frame() {
      if (this.state === 'roll') return Z.animProgress('roll', this.rollT / ROLL_DUR);
      if (this.state === 'attack') return Z.animProgress('attack', this.atkT / ATK_DUR);
      if (this.state === 'special') return Z.animProgress('special', this.spcT / SPC_DUR);
      return Z.animFrame(this.anim, this.animT);
    }

    draw(ctx, cam) {
      for (const g of this.ghosts) Z.drawFrame(ctx, g.f, g.x - cam.x, g.y - cam.y, g.facing, { ghost: true, alpha: 0.35 * (1 - g.t / 0.22) });
      if (this.invuln > 0 && this.state !== 'dead' && Math.floor(this.invuln * 14) % 2 === 0) return;
      const x = this.x - cam.x, y = this.y - cam.y;
      // sombra
      ctx.fillStyle = 'rgba(20,10,30,.25)'; ctx.fillRect(Math.round(x - 12), Math.round(y - 1), 24, 2);
      Z.drawFrame(ctx, this.frame(), x, y, this.facing);
      if (this.iframes) Z.drawFrame(ctx, this.frame(), x, y, this.facing, { ghost: true, alpha: 0.45 });
      if (Z.game.debug) {
        const b = Z.box(this); ctx.strokeStyle = this.iframes ? '#0f0' : '#f0f'; ctx.strokeRect(b.l - cam.x, b.t - cam.y, b.r - b.l, b.b - b.t);
        if (this.state === 'attack' && this.atkT >= ATK_ON && this.atkT <= ATK_OFF) { const a = this.attackRect(); ctx.strokeStyle = '#ff0'; ctx.strokeRect(a.l - cam.x, a.t - cam.y, a.r - a.l, a.b - a.t); }
      }
    }
  }
  Z.Player = Player;
  Z.PLAYER = { STAND_H, CROUCH_H, ROLL_DUR, IFRAME_START, IFRAME_END };
})();

// Inimigos (Pombo, Cabo Eleitoral), projéteis (bolhas, santinhos, onda sonora) e itens.
'use strict';
(() => {
  const G = () => Z.game;

  class Enemy {
    constructor(x, y, w, h, hp) { this.x = x; this.y = y; this.w = w; this.h = h; this.hp = hp; this.maxHp = hp; this.flash = 0; this.dead = false; this.facing = -1; this.t = Z.rand(0, 3); this.contact = true; this.kb = 0; }
    hurtbox() { return Z.box(this); }
    hurt(d, dir) {
      this.hp -= d; this.flash = 0.12; this.kb = dir * 140;
      Z.audio.play('hit');
      if (this.hp <= 0) this.die();
      else this.onHurt && this.onHurt(dir);
    }
    die() {
      this.dead = true;
      Z.emit(this.x, this.y - this.h / 2, 14, { color: this.colors || ['#fff'], speed: 160, size: 3, life: 0.7 });
      Z.emit(this.x, this.y - this.h / 2, 6, { color: '#ffffff', speed: 60, gravity: -30, kind: 'shrink', size: 6, life: 0.4 });
      G().stats.kills++;
      // sempre solta um voto de carisma; às vezes um pão de queijo
      G().pickups.push(new Pickup(this.x, this.y - this.h / 2, 'carisma'));
      if (Math.random() < 0.35) G().pickups.push(new Pickup(this.x, this.y - this.h / 2, 'heal'));
    }
    common(dt) { this.t += dt; this.flash = Math.max(0, this.flash - dt); }
  }

  // ---------------- Pombo da Praça ----------------
  class Pombo extends Enemy {
    constructor(x, y) { super(x, y, 18, 13, 2); this.hx = x; this.hy = y; this.state = 'hover'; this.cd = Z.rand(0.5, 1.5); this.colors = ['#8d90a0', '#686b7a', '#5aa182', '#ffffff']; }
    update(dt) {
      this.common(dt);
      const p = G().player, dx = p.x - this.x, dy = (p.y - 30) - this.y;
      this.cd -= dt;
      if (this.kb) { this.x += this.kb * dt; this.kb = Z.approach(this.kb, 0, 500 * dt); }
      switch (this.state) {
        case 'hover':
          this.x = Z.lerp(this.x, this.hx + Math.sin(this.t * 1.3) * 28, 2 * dt);
          this.y = Z.lerp(this.y, this.hy + Math.sin(this.t * 2.6) * 6, 3 * dt);
          this.facing = Z.sign(dx);
          if (this.cd <= 0 && Math.abs(dx) < 150 && Math.abs(p.x - this.hx) < 200 && dy > -20 && dy < 150 && p.state !== 'dead') {
            this.state = 'alert'; this.st = 0.45; Z.audio.play('coo');
          }
          break;
        case 'alert':
          this.st -= dt; this.y -= 20 * dt;
          if (this.st <= 0) {
            const tx = p.x, ty = p.y - 2, d = Math.hypot(tx - this.x, ty - this.y) || 1;
            this.vx = (tx - this.x) / d * 270; this.vy = (ty - this.y) / d * 270;
            this.facing = Z.sign(this.vx); this.state = 'dive'; this.st = 1.3;
          }
          break;
        case 'dive': {
          this.st -= dt; this.x += this.vx * dt; this.y += this.vy * dt;
          const L = G().level;
          if (L.solidAt(this.x, this.y)) {
            // pousa e fica bicando o chão: a hora de bater!
            this.y = Math.floor(this.y / Z.T) * Z.T; this.state = 'peck'; this.st = 1.2;
            Z.emit(this.x, this.y, 5, { color: '#c9b9a0', speed: 50, gravity: 0, life: 0.3, size: 2 });
          } else if (this.st <= 0) { this.state = 'return'; this.cd = 1.5; }
          break;
        }
        case 'peck':
          this.st -= dt;
          if (this.st <= 0) { this.state = 'return'; this.cd = 1.6; }
          break;
        case 'return': {
          const rx = this.hx - this.x, ry = this.hy - this.y, d = Math.hypot(rx, ry);
          if (d < 4) { this.state = 'hover'; break; }
          this.x += rx / d * 95 * dt; this.y += ry / d * 95 * dt; this.facing = Z.sign(rx);
          break;
        }
      }
    }
    contactOn() { return this.state === 'dive'; }
    onHurt() { if (this.state === 'dive' || this.state === 'alert') { this.state = 'return'; this.cd = 1.8; } }
    draw(ctx, cam) {
      const peckBob = this.state === 'peck' && Math.sin(this.t * 18) > 0 ? 2 : 0;
      Z.art.pigeon(ctx, this.x - cam.x, this.y - cam.y + peckBob, this.facing, this.t, this.state === 'peck' ? 'dive' : this.state, this.flash > 0);
      if (this.state === 'alert') Z.text(ctx, '!', Math.round(this.x - cam.x), Math.round(this.y - cam.y - 28), 10, '#ffe14d', 'center');
    }
  }

  // ---------------- Cabo Eleitoral do Coronel ----------------
  class Cabo extends Enemy {
    constructor(x, y) { super(x, y, 18, 48, 3); this.hx = x; this.state = 'walk'; this.cd = Z.rand(0.6, 1.2); this.dir = -1; this.colors = ['#c8323c', '#34508a', '#f4f1e6', '#ffd34d']; }
    update(dt) {
      this.common(dt);
      const p = G().player, dx = p.x - this.x, L = G().level;
      const aware = Math.abs(dx) < 290 && Math.abs(p.y - this.y) < 70 && p.state !== 'dead';
      let vx = 0;
      if (this.kb) { vx = this.kb; this.kb = Z.approach(this.kb, 0, 600 * dt); }
      this.cd -= dt;
      switch (this.state) {
        case 'walk':
          if (aware) {
            this.facing = Z.sign(dx);
            // mantém distância
            if (Math.abs(dx) < 90) vx += -this.facing * 35; else if (Math.abs(dx) > 200) vx += this.facing * 30;
            if (this.cd <= 0) { this.state = 'wind'; this.st = 0.5; Z.audio.play('alert'); }
          } else {
            vx += this.dir * 28; this.facing = this.dir;
            if (Math.abs(this.x - this.hx) > 50) this.dir = Z.sign(this.hx - this.x);
          }
          break;
        case 'wind':
          this.st -= dt; this.facing = Z.sign(dx);
          if (this.st <= 0) {
            G().projectiles.push(new Santinho(this.x + this.facing * 12, this.y - 44, this.facing * 175));
            Z.audio.play('throw'); this.state = 'throw'; this.st = 0.3;
          }
          break;
        case 'throw':
          this.st -= dt;
          if (this.st <= 0) { this.state = 'walk'; this.cd = Z.rand(1.4, 2.1); }
          break;
      }
      // não cai de beiradas
      const ahead = this.x + Z.sign(vx || 1) * 12;
      if (vx && !L.solidAt(ahead, this.y + 4)) vx = 0;
      L.move(this, vx * dt, 0);
      this.walking = Math.abs(vx) > 5;
    }
    onHurt() { if (this.state === 'wind') { this.state = 'walk'; this.cd = 0.9; } }
    draw(ctx, cam) {
      Z.art.cabo(ctx, this.x - cam.x, this.y - cam.y, this.facing, this.t, this.state, this.flash > 0, this.walking);
      if (this.state === 'wind') Z.text(ctx, '!', Math.round(this.x - cam.x), Math.round(this.y - cam.y - 64), 10, '#ffe14d', 'center');
    }
  }

  // ---------------- projéteis ----------------
  class Bubble {
    constructor(x, y, vx, vy) { this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.r = Z.rand(4, 7); this.t = 0; this.life = 1.15; this.dead = false; this.player = true; this.ph = Z.rand(0, 6); }
    box() { return { l: this.x - this.r, r: this.x + this.r, t: this.y - this.r, b: this.y + this.r }; }
    pop() {
      this.dead = true; Z.audio.play('pop');
      Z.emit(this.x, this.y, 6, { color: ['#d8f2ff', '#ffffff'], speed: 70, gravity: 0, life: 0.25, size: 2 });
    }
    update(dt) {
      const g = G(), L = g.level;
      this.t += dt; this.vy -= 18 * dt;
      this.x += this.vx * dt; this.y += (this.vy + Math.sin(this.t * 10 + this.ph) * 30) * dt;
      this.vx *= (1 - 0.35 * dt);
      if (this.t > this.life) { this.pop(); return; }
      const b = this.box();
      for (const e of g.enemies) {
        if (e.dead || !e.hurtbox) continue;
        if (Z.overlap(b, e.hurtbox())) { e.hurt(0.5, Z.sign(this.vx), 'bubble'); this.pop(); g.hitstop(0.02); return; }
      }
      for (const p of g.projectiles) if (p.enemy && p.breakable && !p.dead && Z.overlap(b, p.box())) { p.destroy(); this.pop(); return; }
      const lv = L.lever;
      if (!lv.on && Z.overlap(b, { l: lv.x - 10, r: lv.x + 10, t: lv.y - 60, b: lv.y - 26 })) { L.lowerBridge(); this.pop(); return; }
      if (L.hitRect(b, 1)) { this.pop(); return; }
      if (L.solidAt(this.x, this.y)) this.pop();
    }
    draw(ctx, cam) {
      const x = Math.round(this.x - cam.x), y = Math.round(this.y - cam.y);
      ctx.fillStyle = 'rgba(190,230,255,.22)'; ctx.beginPath(); ctx.arc(x, y, this.r, 0, 7); ctx.fill();
      ctx.strokeStyle = '#d8f2ff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, this.r, 0, 7); ctx.stroke();
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x - Math.round(this.r * 0.5), y - Math.round(this.r * 0.5), 2, 2);
      ctx.fillStyle = 'rgba(255,170,230,.6)'; ctx.fillRect(x + Math.round(this.r * 0.3), y + Math.round(this.r * 0.2), 1, 2);
    }
  }

  class Santinho {
    constructor(x, y, vx, vy = 0, grav = 0) { this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.grav = grav; this.t = 0; this.dead = false; this.enemy = true; this.breakable = true; }
    box() { return { l: this.x - 5, r: this.x + 5, t: this.y - 4, b: this.y + 4 }; }
    destroy() { this.dead = true; Z.emit(this.x, this.y, 6, { color: ['#f4f1e6', '#c8323c'], speed: 90, size: 2, life: 0.5 }); }
    update(dt) {
      const g = G(); this.t += dt;
      this.vy += this.grav * dt; this.x += this.vx * dt; this.y += this.vy * dt;
      if (this.t > 3 || g.level.solidAt(this.x, this.y)) { this.destroy(); return; }
      if (Z.overlap(this.box(), Z.box(g.player))) {
        const r = g.player.hurt(1, this.x);
        if (r === 'hit') this.destroy();
      }
    }
    draw(ctx, cam) {
      ctx.save(); ctx.translate(Math.round(this.x - cam.x), Math.round(this.y - cam.y));
      const sx = Math.cos(this.t * 14);
      ctx.scale(sx, 1);
      ctx.fillStyle = '#f4f1e6'; ctx.fillRect(-5, -4, 10, 8);
      ctx.fillStyle = '#c8323c'; ctx.fillRect(-5, -4, 10, 2);
      ctx.fillStyle = '#c98b5e'; ctx.fillRect(-2, -1, 4, 3);
      ctx.restore();
    }
  }

  class Wave {
    constructor(x, y, dir, speed = 235) { this.x = x; this.y = y; this.vx = dir * speed; this.t = 0; this.dead = false; this.enemy = true; this.w = 22; this.h = 22; }
    box() { return { l: this.x - this.w / 2, r: this.x + this.w / 2, t: this.y - this.h, b: this.y }; }
    update(dt) {
      const g = G(); this.t += dt; this.x += this.vx * dt;
      if (Math.random() < 0.6) Z.emit(this.x, this.y - 2, 1, { color: '#e8d8a8', speed: 40, gravity: -30, life: 0.3, size: 2 });
      if (g.level.solidAt(this.x + Z.sign(this.vx) * 12, this.y - 8) || this.t > 4) { this.dead = true; return; }
      if (Z.overlap(this.box(), Z.box(g.player))) g.player.hurt(1, this.x);
    }
    draw(ctx, cam) {
      const x = Math.round(this.x - cam.x), y = Math.round(this.y - cam.y), d = Z.sign(this.vx);
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = i === 0 ? '#fff6c8' : i === 1 ? 'rgba(255,214,120,.8)' : 'rgba(255,170,90,.5)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x - d * (i * 7), y - 2, 12 + (this.t * 8 % 3), d > 0 ? -1.3 : Math.PI - 0.27, d > 0 ? 0.27 : Math.PI + 1.3); ctx.stroke();
      }
    }
  }

  // ---------------- itens ----------------
  class Pickup {
    constructor(x, y, kind) { this.x = x; this.y = y; this.kind = kind; this.vx = Z.rand(-60, 60); this.vy = -160; this.t = 0; this.dead = false; this.w = 8; this.h = 8; }
    update(dt) {
      const g = G(), p = g.player, L = g.level;
      this.t += dt;
      const dx = p.x - this.x, dy = (p.y - 26) - this.y, d = Math.hypot(dx, dy);
      if (this.t > 0.4 && d < 60 && p.state !== 'dead') { this.x += dx / d * 220 * dt; this.y += dy / d * 220 * dt; }
      else {
        this.vy = Math.min(400, this.vy + 900 * dt);
        const r = L.move(this, this.vx * dt, this.vy * dt);
        if (r.hitY) { this.vy *= -0.35; this.vx *= 0.6; }
        if (r.hitX) this.vx *= -0.5;
      }
      if (this.t > 10) this.dead = true;
      if (d < 14 && p.state !== 'dead') {
        this.dead = true;
        if (this.kind === 'heal') {
          if (p.hp < p.maxHp) { p.hp++; Z.floatText(p.x, p.y - 64, '+1 vida', '#ffb3c0'); } Z.audio.play('heal');
        } else { p.gainCarisma(0.25); Z.audio.play('pop'); }
      }
    }
    draw(ctx, cam) {
      if (this.t > 8 && Math.floor(this.t * 10) % 2) return;
      const x = Math.round(this.x - cam.x), y = Math.round(this.y - cam.y);
      if (this.kind === 'heal') { // pão de queijo
        ctx.fillStyle = '#e9b94a'; ctx.beginPath(); ctx.arc(x, y - 4, 5, 0, 7); ctx.fill();
        ctx.fillStyle = '#f7d77a'; ctx.fillRect(x - 2, y - 7, 3, 2);
      } else {
        const s = 2 + Math.round(Math.sin(this.t * 10));
        ctx.fillStyle = '#9fe0ff'; ctx.fillRect(x - 1, y - 4 - s, 2, s * 2 + 2); ctx.fillRect(x - 1 - s, y - 4, s * 2 + 2, 2);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 1, y - 4, 2, 2);
      }
    }
  }

  Z.Enemy = Enemy; Z.Pombo = Pombo; Z.Cabo = Cabo;
  Z.Bubble = Bubble; Z.Santinho = Santinho; Z.Wave = Wave; Z.Pickup = Pickup;
})();
